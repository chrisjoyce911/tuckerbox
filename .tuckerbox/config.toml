# Tuckerbox runs this repository's own OpenSpec changes.
# Checked with: tuckerbox check

max_parallel = 4
ship = "mr"           # push, open the PR, fix CI and review findings, stop at green

[workflow]
steps = ["build", "review"]

[steps.build]
agent = "claude"
role = "builder"
permissions = "edit"     # machine profile: edits in the worktree, go and read-only git commands

[steps.review]
agent = "codex"
role = "reviewer"
permissions = "review"   # machine profile; the reviewer reports in its final message, so read-only works
on_reject = "build"
max_rounds = 3

[shipping]
remote = "origin"
fix_ci = "fix_ci"
fix_review = "fix_ci"
max_rounds = 3
archive = true

[steps.fix_ci]
agent = "claude"
role = "fixer"
permissions = "edit"
