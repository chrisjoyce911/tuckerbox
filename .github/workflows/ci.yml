name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    # Job names are stable: they are the repository's required status checks.
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          # The minimum version go.mod declares.
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test -race
        # The race detector needs cgo; the shipped binary does not.
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: go build (no cgo)
        env:
          CGO_ENABLED: "0"
        run: go build ./...

  herdr-mod:
    # The board mod's action mapping and data rules; plain node, no npm install.
    name: herdr mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: node --test
        run: node --test herdr/mods/tuckerbox-board/test/*.test.js

  tla:
    name: tla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: TLC on formal/ (models pass, broken variants rejected)
        run: scripts/tla-check.sh
